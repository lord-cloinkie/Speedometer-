<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Speedo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --fg:#e6fffb; --mid:#8fb8b2; --dim:#4c6663; --line:#10201f; --accent:#1de9d0; --accent2:#0e9f8f;
  --font:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{
  box-sizing:border-box;font-family:var(--font);color:var(--fg);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;
}
#app{height:100%;display:flex;flex-direction:column;align-items:center;transition:transform 2.5s ease,opacity .3s}
#stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#speed{
  font-weight:300;line-height:.85;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  font-size:min(50vw,36vh);color:var(--accent);
}
#unit{margin-top:1.8vmin;font-weight:500;letter-spacing:.08em;color:var(--accent2);font-size:clamp(16px,4.2vmin,28px)}
#status{margin-top:14px;min-height:1.3em;padding:0 24px;text-align:center;color:var(--dim);font-size:clamp(14px,3vmin,19px);font-weight:500}
#widgets{display:flex;gap:34px;align-items:baseline;justify-content:center;padding:0 16px 20px;flex-wrap:wrap;font-weight:500;font-size:clamp(22px,5.4vmin,38px);color:var(--mid)}
#widgets[hidden],.w[hidden]{display:none}
.w small{font-size:.52em;color:var(--dim);margin-right:7px;letter-spacing:.04em}
a.w{color:var(--mid);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 18px 4px;font-size:.8em}
@media (orientation:landscape){
  #speed{font-size:min(34vw,64vh)}
  #widgets{padding-bottom:10px}
}
#hold{position:fixed;left:0;bottom:0;height:3px;width:0;background:var(--accent);z-index:5}
#hold.on{width:100%;transition:width 3s linear}
#menu{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);z-index:10;touch-action:pan-y}
#menu.open{display:flex}
#sheet{
  width:100%;max-width:520px;max-height:88%;overflow-y:auto;box-sizing:border-box;
  background:#041010;border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:14px 22px calc(18px + env(safe-area-inset-bottom,0px));
}
#sheet h2{margin:12px 0 2px;font-size:17px;font-weight:500;color:var(--dim);letter-spacing:.03em}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:22px;font-weight:500}
.sw{width:50px;height:30px;border-radius:15px;background:#12201f;border:0;position:relative;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#5d7d79;transition:transform .2s,background .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px);background:#000}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:20px;background:none;border:0;color:var(--dim);padding:5px 20px}
.seg button.on{background:var(--accent);color:#000}
input[type=range]{width:55%;accent-color:var(--accent)}
.btns{display:flex;gap:12px;margin-top:16px}
.btns button{flex:1;font:inherit;font-size:22px;border-radius:12px;padding:11px 0;border:1px solid var(--line);background:none;color:var(--mid)}
.btns button.main{background:var(--accent);border-color:var(--accent);color:#000}
@media (prefers-reduced-motion:reduce){#app{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="speed">--</div>
    <div id="unit">km/h</div>
    <div id="status">Tap to start. Hold 3 seconds for the menu.</div>
  </div>
  <div id="widgets" hidden>
    <div class="w" id="wClock" hidden></div>
    <div class="w" id="wTop" hidden></div>
    <a class="w" id="wMaps" href="https://www.google.com/maps" target="_blank" rel="noopener" hidden>Maps</a>
  </div>
</div>
<div id="hold"></div>

<div id="menu">
  <div id="sheet">
    <h2>Speed unit</h2>
    <div class="row"><span>Units</span>
      <div class="seg"><button data-u="kph">km/h</button><button data-u="mph">mph</button></div></div>
    <h2>Widgets</h2>
    <div class="row"><span>Clock</span><button class="sw" data-k="clock"></button></div>
    <div class="row"><span>Top speed</span><button class="sw" data-k="top"></button></div>
    <div class="row"><span>Google Maps shortcut</span><button class="sw" data-k="maps"></button></div>
    <h2>Display</h2>
    <div class="row"><span>12-hour clock</span><button class="sw" data-k="h12"></button></div>
    <div class="row"><span>Keep screen on</span><button class="sw" data-k="wake"></button></div>
    <div class="row"><span>Brightness</span><input type="range" id="dim" min="15" max="100" step="5"></div>
    <div class="btns"><button id="resetTop">Reset top speed</button><button class="main" id="done">Done</button></div>
  </div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var DEF={unit:'kph',clock:false,top:false,maps:false,h12:false,wake:true,dim:100};
  var S=Object.assign({},DEF);
  try{Object.assign(S,JSON.parse(localStorage.getItem('speedo')||'{}'))}catch(e){}
  function save(){try{localStorage.setItem('speedo',JSON.stringify(S))}catch(e){}}

  var app=$('#app'),stage=$('#stage'),speedEl=$('#speed'),unitEl=$('#unit'),statusEl=$('#status'),
      hold=$('#hold'),menu=$('#menu');
  var started=false,hasFix=false,sp=0,top=0,last=null,watchId=null,wl=null,menuOpen=false;

  function factor(){return S.unit==='kph'?3.6:2.23694}
  function unitName(){return S.unit==='kph'?'km/h':'mph'}

  function render(){
    var f=factor();
    speedEl.textContent=hasFix?Math.round(sp*f):'--';
    unitEl.textContent=unitName();
    $('#wTop').innerHTML='<small>top</small>'+Math.round(top*f)+' <small>'+unitName()+'</small>';
  }
  function clock(){
    var d=new Date(),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2),suf='';
    if(S.h12){suf=' <small>'+(h>=12?'pm':'am')+'</small>';h=h%12||12}else{h=('0'+h).slice(-2)}
    $('#wClock').innerHTML=h+':'+m+suf;
  }
  function apply(){
    $('#wClock').hidden=!S.clock;
    $('#wTop').hidden=!S.top;
    $('#wMaps').hidden=!S.maps;
    $('#widgets').hidden=!(S.clock||S.top||S.maps);
    app.style.opacity=S.dim/100;
    document.querySelectorAll('.sw').forEach(function(b){b.classList.toggle('on',!!S[b.dataset.k])});
    document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.u===S.unit)});
    $('#dim').value=S.dim;
    clock();render();
  }

  /* GPS */
  function dist(a,b,c,d){
    var R=6371000,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;
    var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)*Math.sin(dn/2);
    return 2*R*Math.asin(Math.sqrt(x));
  }
  function onPos(p){
    var c=p.coords,v=c.speed;
    if(v==null||isNaN(v)){
      v=0;
      if(last){var dt=(p.timestamp-last.t)/1000;if(dt>0)v=dist(last.la,last.lo,c.latitude,c.longitude)/dt}
    }
    last={la:c.latitude,lo:c.longitude,t:p.timestamp};
    sp=hasFix?sp+(v-sp)*0.6:v;
    if(sp*3.6<1.5)sp=0;
    hasFix=true;
    if(sp>top)top=sp;
    statusEl.textContent='';
    render();
  }
  function onErr(e){
    if(e.code===1){statusEl.textContent='Location is blocked. Allow location for this page in your browser settings.'}
    else{statusEl.textContent='Searching for GPS signal…'}
  }
  function start(){
    started=true;
    statusEl.textContent='Searching for GPS signal…';
    if(!navigator.geolocation){statusEl.textContent='This browser has no GPS support.';return}
    watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
    lock();
  }
  async function lock(){
    if(!S.wake||!('wakeLock' in navigator))return;
    try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  }
  function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&started)lock()});

  /* Touch: tap = toggle unit, hold 3s = menu */
  var timer=null,t0=0,sx=0,sy=0,fired=false;
  function cancelHold(){clearTimeout(timer);timer=null;hold.classList.remove('on')}
  app.addEventListener('pointerdown',function(e){
    if(menuOpen)return;
    fired=false;t0=Date.now();sx=e.clientX;sy=e.clientY;
    hold.classList.add('on');
    timer=setTimeout(function(){timer=null;fired=true;cancelHold();openMenu()},3000);
  });
  app.addEventListener('pointermove',function(e){
    if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>14)cancelHold();
  });
  app.addEventListener('pointerup',function(e){
    var wasTap=timer&&Date.now()-t0<500;
    cancelHold();
    if(!wasTap||fired)return;
    if(!stage.contains(e.target))return;
    if(!started){start();return}
    S.unit=S.unit==='kph'?'mph':'kph';save();apply();
  });
  app.addEventListener('pointercancel',cancelHold);
  document.addEventListener('contextmenu',function(e){e.preventDefault()});

  /* Menu */
  function openMenu(){menuOpen=true;menu.classList.add('open')}
  function closeMenu(){menuOpen=false;menu.classList.remove('open')}
  menu.addEventListener('click',function(e){if(e.target===menu)closeMenu()});
  $('#done').addEventListener('click',closeMenu);
  $('#resetTop').addEventListener('click',function(){top=0;render()});
  document.querySelectorAll('.sw').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.k;S[k]=!S[k];save();apply();
      if(k==='wake'){S.wake?lock():unlock()}
    });
  });
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click',function(){S.unit=b.dataset.u;save();apply()});
  });
  $('#dim').addEventListener('input',function(e){S.dim=+e.target.value;save();apply()});

  /* Clock tick + OLED burn-in shift */
  setInterval(clock,1000);
  setInterval(function(){
    var dx=Math.round((Math.random()-.5)*14),dy=Math.round((Math.random()-.5)*14);
    app.style.transform='translate('+dx+'px,'+dy+'px)';
  },60000);

  apply();
})();
</script>
</body>
</html>
