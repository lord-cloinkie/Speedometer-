<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Speedo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --fg:#e6fffb; --mid:#8fb8b2; --dim:#4c6663; --line:#10201f; --accent:#1de9d0; --accent2:#0e9f8f; --sheet:#041010; --sw:#12201f;
  --font:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{
  box-sizing:border-box;font-family:var(--font);color:var(--fg);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;
}
#app{height:100%;display:flex;flex-direction:column;align-items:center;transition:transform 2.5s ease,opacity .3s}
#stage{display:flex;flex-direction:column;align-items:center;font-weight:inherit}
#speed{
  font-weight:300;line-height:.85;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  font-size:min(50vw,36vh);color:var(--accent);
}
#unit{margin-top:1.8vmin;font-weight:500;letter-spacing:.08em;color:var(--accent2);font-size:clamp(16px,4.2vmin,28px)}
#status{margin-top:14px;min-height:1.3em;padding:0 24px;text-align:center;white-space:normal;width:max-content;max-width:86vw;color:var(--dim);font-size:clamp(14px,3vmin,19px);font-weight:500}
#widgets{position:absolute;inset:0;pointer-events:none}
.w{position:absolute;left:50%;top:90%;transform:translate(-50%,-50%);pointer-events:auto;white-space:nowrap;touch-action:none;font-weight:500;font-size:clamp(22px,5.4vmin,38px);color:var(--mid)}
#widgets[hidden],.w[hidden]{display:none}
.w small{font-size:.52em;color:var(--dim);margin-right:7px;letter-spacing:.04em}
a.w{color:var(--mid);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 18px 4px;font-size:calc(clamp(22px,5.4vmin,38px)*.8)}
@media (orientation:landscape){
  #speed{font-size:min(34vw,64vh)}
}
#hold{position:fixed;left:0;bottom:0;height:3px;width:0;background:var(--accent);z-index:5}
#hold.on{width:100%;transition:width 3s linear}
#menu{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);z-index:10;touch-action:pan-y}
#menu.open{display:flex}
#sheet{
  width:100%;max-width:520px;max-height:88%;overflow-y:auto;box-sizing:border-box;
  background:var(--sheet);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:14px 22px calc(18px + env(safe-area-inset-bottom,0px));
}
#sheet h2{margin:12px 0 2px;font-size:17px;font-weight:500;color:var(--dim);letter-spacing:.03em}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:22px;font-weight:500}
.sw{width:50px;height:30px;border-radius:15px;background:var(--sw);border:0;position:relative;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px);background:#000}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:20px;background:none;border:0;color:var(--dim);padding:5px 20px}
.seg button.on{background:var(--accent);color:#000}
input[type=range]{width:55%;accent-color:var(--accent)}
#hue{-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;background:linear-gradient(90deg,hsl(0,80%,52%),hsl(60,80%,52%),hsl(120,80%,52%),hsl(180,80%,52%),hsl(240,80%,52%),hsl(300,80%,52%),hsl(360,80%,52%))}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #000;box-shadow:0 0 0 1px var(--dim)}
#hue::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid #000}
#editBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));display:none;align-items:center;gap:8px;z-index:8;background:var(--sheet);border:1px solid var(--line);border-radius:24px;padding:6px 10px;font-size:18px;font-weight:500;color:var(--mid);width:min(420px,calc(100% - 16px));box-sizing:border-box;flex-wrap:wrap;justify-content:center}
body.editing #editBar{display:flex}
#editBar button{font:inherit;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mid);padding:4px 16px}
#editBar button.main{background:var(--accent);border-color:var(--accent);color:#000}
body.editing .w{outline:1px dashed var(--accent2);outline-offset:10px}
#grid{position:fixed;inset:0;pointer-events:none;display:none;opacity:.6;background-image:radial-gradient(circle,var(--accent2) 1.5px,transparent 2.2px);background-size:var(--cell,40px) var(--cell,40px);background-position:center}
body.editing.snap #grid{display:block}
body.editing .w.sel{outline:2px solid var(--accent)}
#wTrip.run{color:var(--accent)}
.row small{display:block;font-size:15px;color:var(--dim);font-weight:500;line-height:1.1}
.sw:disabled{opacity:.3}
#tripPop{position:fixed;z-index:7;display:flex;gap:14px;padding:10px;background:var(--sheet);border:1px solid var(--line);border-radius:999px}
#tripPop[hidden]{display:none}
#tripPop button{width:56px;height:56px;border-radius:50%;border:1px solid var(--accent2);background:none;color:var(--accent);display:grid;place-items:center;padding:0}
#tripPop svg{width:26px;height:26px}
#tpGo svg{fill:currentColor}
#tpGo.on{background:var(--accent);color:#000}
#editSize{flex-basis:100%;width:100%;margin:2px 0 4px;accent-color:var(--accent)}
#editHint{flex:1}
.btns{display:flex;gap:12px;margin-top:16px}
.btns button{flex:1;font:inherit;font-size:22px;border-radius:12px;padding:11px 0;border:1px solid var(--line);background:none;color:var(--mid)}
.btns button.main{background:var(--accent);border-color:var(--accent);color:#000}
@media (prefers-reduced-motion:reduce){#app{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage" class="w">
    <div id="speed">--</div>
    <div id="unit">km/h</div>
    <div id="status">Tap to start. Hold 3 seconds for the menu.</div>
  </div>
  <div id="widgets" hidden>
    <div class="w" id="wClock" hidden></div>
    <div class="w" id="wTop" hidden></div>
    <div class="w" id="wTrip" hidden></div>
    <div class="w" id="wAvg" hidden></div>
    <a class="w" id="wMaps" href="https://www.google.com/maps" target="_blank" rel="noopener" hidden>Maps</a>
  </div>
</div>
<div id="tripPop" hidden><button id="tpGo"></button><button id="tpReset" aria-label="Reset trip"></button></div>
<div id="grid"></div>
<div id="hold"></div>
<div id="editBar"><span id="editHint"></span><button id="editSnap"></button><button id="editReset">Reset</button><button class="main" id="editDone">Done</button><input type="range" id="editSize" min="0.3" max="6" step="0.05"></div>

<div id="menu">
  <div id="sheet">
    <h2>Speed unit</h2>
    <div class="row"><span>Units</span>
      <div class="seg"><button data-u="kph">km/h</button><button data-u="mph">mph</button></div></div>
    <h2>Widgets</h2>
    <div class="row"><span>Clock</span><button class="sw" data-k="clock"></button></div>
    <div class="row"><span>Top speed</span><button class="sw" data-k="top"></button></div>
    <div class="row"><span>Trip distance</span><button class="sw" data-k="trip"></button></div>
    <div class="row"><span>Average speed<small id="avgNote"></small></span><button class="sw" data-k="avg"></button></div>
    <div class="row"><span>Google Maps shortcut</span><button class="sw" data-k="maps"></button></div>
    <h2>Display</h2>
    <div class="row"><span>12-hour clock</span><button class="sw" data-k="h12"></button></div>
    <div class="row"><span>Keep screen on</span><button class="sw" data-k="wake"></button></div>
    <div class="row"><span>Full screen</span><button class="sw" data-k="full"></button></div>
    <div class="row"><span>Colour</span><input type="range" id="hue" min="0" max="360" step="1"></div>
    <div class="row"><span id="holdLbl">Hold to open</span><input type="range" id="holdT" min="1" max="6" step="0.5"></div>
    <div class="btns"><button id="editLay">Edit layout</button><button id="resetTop">Reset top speed</button></div>
    <div class="btns"><button id="resetTrip">Reset trip</button><button class="main" id="done">Done</button></div>
  </div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var DEF={unit:'kph',clock:false,top:false,maps:false,h12:false,wake:true,full:true,hue:171,lay:{},snap:true,hold:1,trip:false,avg:false};
  var S=Object.assign({},DEF);
  try{Object.assign(S,JSON.parse(localStorage.getItem('speedo')||'{}'))}catch(e){}
  S.avg=false;
  function save(){try{localStorage.setItem('speedo',JSON.stringify(S))}catch(e){}}

  var app=$('#app'),stage=$('#stage'),speedEl=$('#speed'),unitEl=$('#unit'),statusEl=$('#status'),
      hold=$('#hold'),menu=$('#menu');
  var started=false,hasFix=false,sp=0,top=0,trip=(function(){try{return +localStorage.getItem('speedo_trip')||0}catch(e){return 0}})(),tripT=(function(){try{return +localStorage.getItem('speedo_tript')||0}catch(e){return 0}})(),tripRun=false,last=null,watchId=null,wl=null,menuOpen=false;

  function factor(){return S.unit==='kph'?3.6:2.23694}
  function unitName(){return S.unit==='kph'?'km/h':'mph'}

  function render(){
    var f=factor();
    speedEl.textContent=hasFix?Math.round(sp*f):'--';
    unitEl.textContent=unitName();
    $('#wTop').innerHTML='<small>top</small>'+Math.round(top*f)+' <small>'+unitName()+'</small>';
    var td=trip/(S.unit==='kph'?1000:1609.344);
    $('#wTrip').innerHTML='<small>trip</small>'+td.toFixed(td<100?1:0)+' <small>'+(S.unit==='kph'?'km':'mi')+'</small>';
    $('#wTrip').classList.toggle('run',tripRun);
    var av=tripT>=5?trip/tripT*f:0;
    $('#wAvg').innerHTML='<small>avg</small>'+(tripT>=5?(av<100?av.toFixed(1):Math.round(av)):'--')+' <small>'+unitName()+'</small>';
  }
  function clock(){
    var d=new Date(),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2),suf='';
    if(S.h12){suf=' <small>'+(h>=12?'pm':'am')+'</small>';h=h%12||12}else{h=('0'+h).slice(-2)}
    $('#wClock').innerHTML=h+':'+m+suf;
  }
  function apply(){
    $('#wClock').hidden=!S.clock;
    $('#wTop').hidden=!S.top;
    $('#wTrip').hidden=!S.trip;
    $('#wAvg').hidden=!S.avg;
    var canAvg=S.trip&&tripRun,ab=document.querySelector('[data-k="avg"]');
    ab.disabled=!(canAvg||S.avg);
    $('#avgNote').textContent=(canAvg||S.avg)?'':'Needs a running trip';
    $('#wMaps').hidden=!S.maps;
    $('#widgets').hidden=!(S.clock||S.top||S.trip||S.avg||S.maps);
    document.querySelectorAll('.sw').forEach(function(b){b.classList.toggle('on',!!S[b.dataset.k])});
    document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.u===S.unit)});
    $('#hue').value=S.hue;
    setHue();place();clock();render();
    $('#holdT').value=S.hold;$('#holdLbl').textContent='Hold to open: '+S.hold+'s';
    if(!started)statusEl.textContent='Tap to start. Hold '+S.hold+' seconds for the menu.';
  }

  /* GPS */
  function dist(a,b,c,d){
    var R=6371000,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;
    var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)*Math.sin(dn/2);
    return 2*R*Math.asin(Math.sqrt(x));
  }
  function onPos(p){
    var c=p.coords,v=c.speed;
    if(v==null||isNaN(v)){
      v=0;
      if(last){var dt=(p.timestamp-last.t)/1000;if(dt>0)v=dist(last.la,last.lo,c.latitude,c.longitude)/dt}
    }
    if(tripRun&&last&&c.accuracy<=40&&v>0.6){
      var dd=dist(last.la,last.lo,c.latitude,c.longitude);
      if(dd<2000){
        trip+=dd;
        var dtm=(p.timestamp-last.t)/1000;
        if(dtm>0&&dtm<30)tripT+=dtm;
      }
    }
    saveTrip();
    last={la:c.latitude,lo:c.longitude,t:p.timestamp};
    sp=hasFix?sp+(v-sp)*0.6:v;
    if(sp*3.6<1.5)sp=0;
    hasFix=true;
    if(sp>top)top=sp;
    statusEl.textContent='';
    render();
  }
  function onErr(e){
    if(e.code===1){statusEl.textContent='Location is blocked. Allow location for this page in your browser settings.'}
    else{statusEl.textContent='Searching for GPS signal…'}
  }
  function start(){
    started=true;
    statusEl.textContent='Searching for GPS signal…';
    if(!navigator.geolocation){statusEl.textContent='This browser has no GPS support.';return}
    watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
    lock();
    if(S.full)goFull();
  }
  function goFull(){try{var d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen({navigationUI:'hide'}).catch(function(){})}catch(e){}}
  function exitFull(){try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
  async function lock(){
    if(!S.wake||!('wakeLock' in navigator))return;
    try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  }
  function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&started)lock()});

  /* Touch: tap = toggle unit, hold 3s = menu */
  var timer=null,t0=0,sx=0,sy=0,fired=false;
  function cancelHold(){clearTimeout(timer);timer=null;hold.classList.remove('on')}
  app.addEventListener('pointerdown',function(e){
    if(menuOpen||editing)return;
    fired=false;t0=Date.now();sx=e.clientX;sy=e.clientY;
    hold.style.transitionDuration=S.hold+'s';
    hold.classList.add('on');
    timer=setTimeout(function(){timer=null;fired=true;cancelHold();openMenu()},S.hold*1000);
  });
  app.addEventListener('pointermove',function(e){
    if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>14)cancelHold();
  });
  app.addEventListener('pointerup',function(e){
    var wasTap=timer&&Date.now()-t0<500;
    cancelHold();
    if(!wasTap||fired)return;
    if(!started){start();return}
    if(WID.trip.contains(e.target)){pop.hidden?showPop():hidePop();return}
    if(!stage.contains(e.target))return;
    S.unit=S.unit==='kph'?'mph':'kph';save();apply();
  });
  app.addEventListener('pointercancel',cancelHold);
  document.addEventListener('contextmenu',function(e){e.preventDefault()});

  /* Menu */
  function openMenu(){menuOpen=true;menu.classList.add('open')}
  function closeMenu(){menuOpen=false;menu.classList.remove('open')}
  menu.addEventListener('click',function(e){if(e.target===menu)closeMenu()});
  $('#done').addEventListener('click',closeMenu);
  $('#resetTop').addEventListener('click',function(){top=0;render()});
  $('#resetTrip').addEventListener('click',function(){trip=0;tripT=0;saveTrip();render()});
  document.querySelectorAll('.sw').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.k;S[k]=!S[k];save();apply();
      if(k==='wake'){S.wake?lock():unlock()}
      if(k==='full'){S.full?goFull():exitFull()}
      if(k==='trip'&&!S.trip){tripRun=false;S.avg=false;save();apply()}
    });
  });
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click',function(){S.unit=b.dataset.u;save();apply()});
  });

  /* Trip popup: start/pause and reset */
  var pop=$('#tripPop');
  var ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
  var ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  $('#tpReset').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>';
  function saveTrip(){try{localStorage.setItem('speedo_trip',trip);localStorage.setItem('speedo_tript',tripT)}catch(e){}}
  function tripUI(){
    var g=$('#tpGo');
    g.innerHTML=tripRun?ICON_PAUSE:ICON_PLAY;
    g.classList.toggle('on',tripRun);
    g.setAttribute('aria-label',tripRun?'Pause trip':'Start trip');
  }
  function showPop(){
    var w=$('#wTrip');if(w.hidden)return;
    tripUI();pop.hidden=false;
    var r=w.getBoundingClientRect(),pw=pop.offsetWidth,above=r.top>110;
    pop.style.left=clamp(r.left+r.width/2,pw/2+8,window.innerWidth-pw/2-8)+'px';
    pop.style.top=(above?r.top-12:r.bottom+12)+'px';
    pop.style.transform=above?'translate(-50%,-100%)':'translate(-50%,0)';
  }
  function hidePop(){pop.hidden=true}
  $('#tpGo').addEventListener('click',function(){tripRun=!tripRun;tripUI();apply()});
  $('#tpReset').addEventListener('click',function(){trip=0;tripT=0;saveTrip();render()});
  document.addEventListener('pointerdown',function(e){
    if(!pop.hidden&&!e.target.closest('#tripPop')&&!WID.trip.contains(e.target))hidePop();
  });

  /* Colour */
  function setHue(){
    var h=S.hue,r=document.documentElement.style;
    r.setProperty('--accent','hsl('+h+',80%,52%)');
    r.setProperty('--accent2','hsl('+h+',85%,34%)');
    r.setProperty('--fg','hsl('+h+',100%,95%)');
    r.setProperty('--mid','hsl('+h+',25%,64%)');
    r.setProperty('--dim','hsl('+h+',16%,35%)');
    r.setProperty('--line','hsl('+h+',30%,10%)');
    r.setProperty('--sheet','hsl('+h+',40%,4%)');
    r.setProperty('--sw','hsl('+h+',25%,14%)');
  }
  $('#hue').addEventListener('input',function(e){S.hue=+e.target.value;save();apply()});

  /* Widget layout: drag to move, pinch or slide to resize */
  var editing=false,sel='speed';
  var DL={p:{speed:{x:.5,y:.42,s:1},clock:{x:.2,y:.9,s:1},top:{x:.8,y:.9,s:1},maps:{x:.5,y:.8,s:1},trip:{x:.5,y:.9,s:1},avg:{x:.5,y:.72,s:1}},
          l:{speed:{x:.5,y:.46,s:1},clock:{x:.1,y:.88,s:1},trip:{x:.27,y:.88,s:1},avg:{x:.5,y:.88,s:1},maps:{x:.7,y:.88,s:1},top:{x:.88,y:.88,s:1}}};
  var WID={speed:stage,clock:$('#wClock'),top:$('#wTop'),trip:$('#wTrip'),avg:$('#wAvg'),maps:$('#wMaps')};
  var NAMES={speed:'Speed',clock:'Clock',top:'Top speed',trip:'Trip',avg:'Average speed',maps:'Maps'};
  function ori(){return window.innerWidth>window.innerHeight?'l':'p'}
  function getL(k){var o=ori(),v=(S.lay[o]&&S.lay[o][k])||DL[o][k];return {x:v.x,y:v.y,s:v.s}}
  function setL(k,v){var o=ori();S.lay[o]=S.lay[o]||{};S.lay[o][k]=v}
  function place(){
    Object.keys(WID).forEach(function(k){
      var v=getL(k),e=WID[k];
      e.style.left=v.x*100+'%';e.style.top=v.y*100+'%';
      e.style.transform='translate(-50%,-50%) scale('+v.s+')';
    });
  }
  function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
  function cell(){return Math.min(window.innerWidth,window.innerHeight)/10}
  function grid(){document.documentElement.style.setProperty('--cell',cell()+'px')}
  window.addEventListener('resize',function(){place();grid()});
  function snapBtn(){$('#editSnap').textContent=S.snap?'Snap on':'Snap off';document.body.classList.toggle('snap',!!S.snap)}
  function select(k){
    sel=k;
    Object.keys(WID).forEach(function(n){WID[n].classList.toggle('sel',n===k)});
    $('#editHint').textContent=NAMES[k]+': drag or pinch';
    $('#editSize').value=getL(k).s;
  }
  function setEdit(on){
    editing=on;document.body.classList.toggle('editing',on);grid();snapBtn();
    if(on){if(WID[sel].hidden)sel='speed';select(sel)}
    else Object.keys(WID).forEach(function(n){WID[n].classList.remove('sel')});
  }
  var ptrs={},raw=null,dragOK=false;
  function ids(){return Object.keys(ptrs)}
  document.addEventListener('pointerdown',function(e){
    if(!editing||e.target.closest('#editBar'))return;
    var w=e.target.closest('.w');
    if(ids().length===0){
      if(w){var k=Object.keys(WID).filter(function(n){return WID[n]===w})[0];if(k)select(k)}
      dragOK=!!w;raw=getL(sel);
    }else{dragOK=false}
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  });
  document.addEventListener('pointermove',function(e){
    var p=ptrs[e.pointerId];if(!editing||!p)return;
    var keys=ids(),W=window.innerWidth,H=window.innerHeight;
    if(!raw)raw=getL(sel);
    if(keys.length===1){
      if(dragOK){raw.x+=(e.clientX-p.x)/W;raw.y+=(e.clientY-p.y)/H}
    }else{
      var o=ptrs[keys[0]===String(e.pointerId)?keys[1]:keys[0]];
      var d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
      if(d0>10)raw.s*=d1/d0;
    }
    p.x=e.clientX;p.y=e.clientY;
    raw.x=clamp(raw.x,.03,.97);raw.y=clamp(raw.y,.03,.97);raw.s=clamp(raw.s,.3,6);
    var v={x:raw.x,y:raw.y,s:raw.s};
    if(S.snap){var c=cell();v.x=clamp(.5+Math.round((v.x-.5)*W/c)*c/W,.03,.97);v.y=clamp(.5+Math.round((v.y-.5)*H/c)*c/H,.03,.97);v.s=Math.round(v.s*10)/10}
    setL(sel,v);place();$('#editSize').value=v.s;
  });
  function up(e){
    if(!ptrs[e.pointerId])return;
    delete ptrs[e.pointerId];
    if(ids().length>0)dragOK=false;
    save();
  }
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
  $('#editSize').addEventListener('input',function(e){
    var v=getL(sel);v.s=+e.target.value;setL(sel,v);raw=null;place();save();
  });
  WID.maps.addEventListener('click',function(e){if(editing)e.preventDefault()});
  $('#editLay').addEventListener('click',function(){closeMenu();setEdit(true)});
  $('#editDone').addEventListener('click',function(){setEdit(false);save()});
  $('#editReset').addEventListener('click',function(){S.lay={};save();place();select(sel)});
  $('#editSnap').addEventListener('click',function(){S.snap=!S.snap;save();snapBtn()});
  $('#holdT').addEventListener('input',function(e){S.hold=+e.target.value;save();apply()});

  /* Clock tick + OLED burn-in shift */
  setInterval(clock,1000);
  setInterval(function(){
    var dx=Math.round((Math.random()-.5)*14),dy=Math.round((Math.random()-.5)*14);
    app.style.transform='translate('+dx+'px,'+dy+'px)';
  },60000);

  apply();
})();
</script>
</body>
</html>
